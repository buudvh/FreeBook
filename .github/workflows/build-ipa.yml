name: Build Unsigned IPA

on:
  push:
    branches: [ main, sigle_reader, refactor/god-objects, feature/comic-video, claude/legado-source-bb5e46 ]
    paths:
      - 'Sources/**'
      - 'project.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Sources/**'
      - 'project.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15
    # Ghi release + nhánh `source` (nguồn LiveContainer) — bước "Publish GitHub Release + LiveContainer Source".
    # `actions: read` cho `gh run list` ở bước "Collect Commit List".
    permissions:
      contents: write
      actions: read

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Version app = số bản đầu CHANGELOG (`## [1.3.NNN]`), số build = số lượt chạy workflow. Mỗi thay đổi đều thêm
    # entry CHANGELOG mới nên version tự nâng theo; CI không commit ngược về repo.
    - name: Resolve App Version
      run: |
        set -euo pipefail
        APP_VERSION=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' Docs/CodeGraph/CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
        if [ -z "$APP_VERSION" ]; then
          echo "::warning::Không đọc được số bản từ Docs/CodeGraph/CHANGELOG.md, dùng 1.3.0"
          APP_VERSION="1.3.0"
        fi
        BUILD_NUMBER="${{ github.run_number }}"
        echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
        echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
        echo "App version: $APP_VERSION ($BUILD_NUMBER)"

    # Mọi commit kể từ lần build xanh trước trên main (một lượt push có thể mang nhiều commit — session chính push
    # gộp sau khi các session con commit xong). Dùng API so sánh vì checkout chỉ có 1 commit (`fetch-depth: 1`).
    # Không lấy được ⇒ chỉ commit cuối như trước. Tin Telegram + ghi chú release đọc file này.
    - name: Collect Commit List
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        mkdir -p build
        LIST=build/commit_subjects.txt
        : > "$LIST"
        PREV_SHA=$(gh run list --repo "$REPO" --workflow build-ipa.yml --branch main --status success --limit 1 --json headSha -q '.[0].headSha' 2>/dev/null || true)
        if [ -n "$PREV_SHA" ] && [ "$PREV_SHA" != "$GITHUB_SHA" ]; then
          gh api "repos/$REPO/compare/${PREV_SHA}...${GITHUB_SHA}" --jq '.commits[].commit.message | split("\n")[0]' > "$LIST" 2>/dev/null || : > "$LIST"
        fi
        if [ ! -s "$LIST" ]; then
          git log -1 --pretty=format:"%s" > "$LIST"
          echo >> "$LIST"
        fi
        echo "COMMIT_COUNT=$(grep -c . "$LIST")" >> "$GITHUB_ENV"
        echo "Commit của lượt build (từ lần build xanh ${PREV_SHA:-không rõ}):"
        cat "$LIST"

    - name: Cache Homebrew
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Caches/Homebrew
          /usr/local/Homebrew
        key: ${{ runner.os }}-homebrew-xcodegen-${{ hashFiles('project.yml') }}
        restore-keys: |
          ${{ runner.os }}-homebrew-xcodegen-

    # audio.cpp (ggml) cho engine VieNeu Turbo GGUF: `Scripts/ci/build_audiocpp_ios.sh` dựng
    # `Vendor/AudioCpp/AudioCpp.xcframework` (project.yml link + embed). Khoá cache = hash của script (tag audio.cpp
    # nằm trong script) ⇒ chỉ build lại khi script đổi; cùng khoá với workflow `audiocpp-ios.yml`.
    - name: Cache AudioCpp.xcframework
      id: audiocpp-cache
      uses: actions/cache@v4
      with:
        path: Vendor/AudioCpp
        key: audiocpp-ios-${{ hashFiles('Scripts/ci/build_audiocpp_ios.sh') }}

    - name: Build audio.cpp (iOS)
      if: steps.audiocpp-cache.outputs.cache-hit != 'true'
      run: bash Scripts/ci/build_audiocpp_ios.sh 2>&1 | tee -a build_error.log

    - name: Install XcodeGen
      run: |
        brew install xcodegen

    - name: Generate Xcode Project
      run: |
        xcodegen generate 2>&1 | tee build_error.log

    - name: Resolve and patch Package dependencies
      run: |
        set -euo pipefail
        xcodebuild -resolvePackageDependencies -project FreeBook.xcodeproj -scheme FreeBook -derivedDataPath build_dd -skipPackagePluginValidation 2>&1 | tee -a build_error.log
        python3 -c '
        import os
        p = "build_dd/SourcePackages/checkouts/espeak-ng-spm/Package.swift"
        if os.path.exists(p):
            os.chmod(p, 0o644)
            with open(p, "r") as f:
                c = f.read()
            target = ".define(\"N_PATH_HOME\", to: \"1024\"),"
            replacement = target + "\n        .unsafeFlags([\"-Wno-error=implicit-function-declaration\", \"-Wno-error=implicit-int\", \"-Wno-error=incompatible-pointer-types\"]),"
            if target in c:
                c = c.replace(target, replacement)
                with open(p, "w") as f:
                    f.write(c)
                print("Patched Package.swift successfully!")
            else:
                print("Error: Target string not found in Package.swift!")
                exit(1)
        else:
            print(f"Error: {p} not found!")
            exit(1)
        '

    - name: Build and Archive App (Unsigned)
      env:
        GOOGLE_CLOUD_TTS_API_KEY: ${{ secrets.GOOGLE_CLOUD_TTS_API_KEY }}
        GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      run: |
        set -euo pipefail
        xcodebuild archive \
          -scheme FreeBook \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath build/FreeBook.xcarchive \
          -derivedDataPath build_dd \
          -skipPackagePluginValidation \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          DEVELOPMENT_TEAM="" \
          MARKETING_VERSION="${APP_VERSION}" \
          CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
          GOOGLE_CLOUD_TTS_API_KEY="${GOOGLE_CLOUD_TTS_API_KEY}" \
          GOOGLE_DRIVE_CLIENT_ID="${GOOGLE_DRIVE_CLIENT_ID}" 2>&1 | tee -a build_error.log

    - name: Print Build Diagnostics on Failure
      if: failure()
      run: |
        python3 -c '
        import os, glob, subprocess, re

        if os.path.exists("build_error.log"):
            print("=== TAIL OF BUILD_ERROR.LOG ===")
            try:
                with open("build_error.log", "r", errors="ignore") as f:
                    lines = f.readlines()
                    err_lines = [l for l in lines if any(w in l for w in ["error:", "Error:", "fatal error", "FAILED"])]
                    print(f"--- Found {len(err_lines)} error lines in build_error.log ---")
                    for l in err_lines[:50]:
                        print("  ", l.strip())
                    print("--- Last 100 lines of build_error.log ---")
                    for l in lines[-100:]:
                        print("  ", l.strip())
            except Exception as e:
                print(f"Error reading build_error.log: {e}")

        results = glob.glob("build_dd/Logs/Build/*.xcresult")
        if results:
            latest = max(results, key=os.path.getmtime)
            print(f"=== XCRESULT: {latest} ===")
            try:
                res = subprocess.run(["xcrun", "xcresulttool", "get", "--path", latest, "--format", "json"], capture_output=True, text=True)
                import json
                data = json.loads(res.stdout)
                issues = data.get("issues", {})
                print("ISSUES:", json.dumps(issues, indent=2))
            except Exception as e:
                print(f"xcresulttool error: {e}")
        
        dia_files = glob.glob("build_dd/**/*.dia", recursive=True)
        print(f"=== FOUND {len(dia_files)} DIA FILES ===")
        for dia in dia_files:
            try:
                with open(dia, "rb") as f:
                    content = f.read()
                    raw_strings = [s.decode("latin1", errors="ignore") for s in re.findall(b"[\x20-\x7e]{3,}", content)]
                    filtered = [s for s in raw_strings if not (s.startswith("-Xcc") or s.startswith("-fmodule-map") or s.startswith("/Applications") or s.startswith("/Users") or "IntermediateBuildFilesPath" in s or len(s) > 150)]
                    has_err = any(w in s.lower() for s in filtered for w in ["error", "invalid", "cannot", "no member", "declared here", "redeclaration", "ambiguous"])
                    if has_err:
                        print(f"\n--- {dia} ---")
                        for s in filtered:
                            if any(w in s.lower() for w in ["error", "invalid", "cannot", "no member", "declared here", "redeclaration", "ambiguous", "type", "note"]):
                                print(f"  {s}")
            except Exception as e:
                pass
        '

    - name: Package IPA
      env:
        GOOGLE_CLOUD_TTS_API_KEY: ${{ secrets.GOOGLE_CLOUD_TTS_API_KEY }}
        GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      run: |
        set -euo pipefail
        mkdir -p build/Payload
        cp -r build/FreeBook.xcarchive/Products/Applications/FreeBook.app build/Payload/

        # Chốt version trong Info.plist của IPA (phòng khi build setting không được thay vào plist).
        APP_PLIST="build/Payload/FreeBook.app/Info.plist"
        set_plist_string() {
          if plutil -extract "$1" xml1 -o - "$APP_PLIST" >/dev/null 2>&1; then
            plutil -replace "$1" -string "$2" "$APP_PLIST"
          else
            plutil -insert "$1" -string "$2" "$APP_PLIST"
          fi
        }
        set_plist_string CFBundleShortVersionString "$APP_VERSION"
        set_plist_string CFBundleVersion "$BUILD_NUMBER"
        echo "Info.plist version: $(plutil -extract CFBundleShortVersionString raw -o - "$APP_PLIST") ($(plutil -extract CFBundleVersion raw -o - "$APP_PLIST"))"

        # Inject Google Cloud TTS API Key vào Info.plist của FreeBook.app
        if [ -n "$GOOGLE_CLOUD_TTS_API_KEY" ] && [ -f "build/Payload/FreeBook.app/Info.plist" ]; then
          echo "Injecting GOOGLE_CLOUD_TTS_API_KEY into build/Payload/FreeBook.app/Info.plist..."
          if plutil -extract GOOGLE_CLOUD_TTS_API_KEY xml1 -o - build/Payload/FreeBook.app/Info.plist >/dev/null 2>&1; then
            plutil -replace GOOGLE_CLOUD_TTS_API_KEY -string "$GOOGLE_CLOUD_TTS_API_KEY" build/Payload/FreeBook.app/Info.plist
          else
            plutil -insert GOOGLE_CLOUD_TTS_API_KEY -string "$GOOGLE_CLOUD_TTS_API_KEY" build/Payload/FreeBook.app/Info.plist
          fi
        fi

        # Inject Google Drive OAuth Client ID (loại iOS, không phải secret nhưng giữ ngoài repo)
        if [ -n "$GOOGLE_DRIVE_CLIENT_ID" ] && [ -f "build/Payload/FreeBook.app/Info.plist" ]; then
          echo "Injecting GOOGLE_DRIVE_CLIENT_ID into build/Payload/FreeBook.app/Info.plist..."
          if plutil -extract GOOGLE_DRIVE_CLIENT_ID xml1 -o - build/Payload/FreeBook.app/Info.plist >/dev/null 2>&1; then
            plutil -replace GOOGLE_DRIVE_CLIENT_ID -string "$GOOGLE_DRIVE_CLIENT_ID" build/Payload/FreeBook.app/Info.plist
          else
            plutil -insert GOOGLE_DRIVE_CLIENT_ID -string "$GOOGLE_DRIVE_CLIENT_ID" build/Payload/FreeBook.app/Info.plist
          fi
        fi

        # 1. Cài đặt espeak-ng trên máy chủ macOS của Github để lấy dữ liệu âm vị đã biên dịch nhị phân
        HOMEBREW_NO_AUTO_UPDATE=1 brew install espeak-ng
        BREW_DATA_PATH="$(brew --prefix espeak-ng)/share/espeak-ng-data"
        DEST_DATA_PATH="build/Payload/FreeBook.app/espeak-ng_data.bundle/espeak-ng-data"
        
        if [ -d "$DEST_DATA_PATH" ]; then
          echo "Copying compiled espeak-ng database files recursively to $DEST_DATA_PATH"
          cp -R "$BREW_DATA_PATH"/* "$DEST_DATA_PATH"/
          
          # 2. Xóa các từ điển ngôn ngữ không sử dụng để giảm dung lượng file IPA
          echo "Cleaning up unnecessary dictionaries..."
          for f in "$DEST_DATA_PATH"/*_dict; do
            [ -e "$f" ] || continue
            filename=$(basename "$f")
            if [ "$filename" != "vi_dict" ] && [ "$filename" != "en_dict" ]; then
              rm -f "$f"
            fi
          done
          
          # 3. Dọn dẹp các tệp cấu hình giọng nói dư thừa
          VOICES_DIR="$DEST_DATA_PATH/voices"
          if [ -d "$VOICES_DIR" ]; then
            echo "Cleaning up unnecessary voices..."
            for d in "$VOICES_DIR"/*; do
              [ -e "$d" ] || continue
              name=$(basename "$d")
              if [ -d "$d" ]; then
                if [ "$name" != "!v" ] && [ "$name" != "en" ] && [ "$name" != "asia" ]; then
                  rm -rf "$d"
                fi
              else
                case "$name" in
                  active|default|en*|vi*) ;;
                  *) rm -f "$d" ;;
                esac
              fi
            done
            
            # Chỉ giữ giọng đọc tiếng Việt trong voices/asia
            if [ -d "$VOICES_DIR/asia" ]; then
              for f in "$VOICES_DIR/asia"/*; do
                [ -e "$f" ] || continue
                name=$(basename "$f")
                case "$name" in
                  vi*) ;;
                  *) rm -rf "$f" ;;
                esac
              done
            fi
          fi
          
          # 4. Xác minh sự tồn tại của các file cơ sở dữ liệu quan trọng
          echo "Verifying core espeak-ng database files..."
          test -f "$DEST_DATA_PATH/phondata"
          test -f "$DEST_DATA_PATH/phontab"
          test -f "$DEST_DATA_PATH/phonindex"
          test -f "$DEST_DATA_PATH/intonations"
          echo "Core verification successful!"
        else
          echo "Error: $DEST_DATA_PATH does not exist!"
          exit 1
        fi

        # Ghi chú "Có gì mới ở bản này" trong app (Cài đặt › Thông Tin › "?", `AppReleaseNotesLoader`): danh sách commit
        # của lượt build (bước Collect Commit List), định dạng `- <subject>` + bỏ dòng trùng như ghi chú release.
        # Thiếu danh sách / lỗi ⇒ bỏ qua (app tự dự phòng bằng apps.json), không bao giờ làm đỏ build.
        NOTES_PATH="build/Payload/FreeBook.app/ReleaseNotes.txt"
        if [ -s build/commit_subjects.txt ]; then
          if python3 Scripts/ci/telegram_commit_summary.py --list build/commit_subjects.txt --format notes > "$NOTES_PATH"; then
            echo "ReleaseNotes.txt: $(grep -c . "$NOTES_PATH" || true) dòng"
          else
            echo "::warning::Không ghi được ReleaseNotes.txt — bỏ qua"
            rm -f "$NOTES_PATH" || true
          fi
        else
          echo "Không có build/commit_subjects.txt ⇒ không ghi ReleaseNotes.txt"
        fi

        cd build
        zip -r FreeBook.ipa Payload
        echo "IPA packaged successfully at build/FreeBook.ipa"

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FreeBook-unsigned-ipa
        path: build/FreeBook.ipa
        if-no-files-found: ignore

    # Release `build-<số build>` + nguồn LiveContainer `apps.json` ở nhánh `source`, giữ 5 bản mới nhất
    # (`Scripts/ci/publish_altstore_source.py`). Chỉ lượt push lên main. Lỗi ở đây không làm hỏng lượt build:
    # IPA vẫn gửi Telegram như cũ, chỉ thiếu link nguồn `apps.json` (tin Telegram gửi link nguồn, không gửi link release).
    - name: Publish GitHub Release + LiveContainer Source
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        # Ghi chú release (và `localizedDescription` của `apps.json`) = mọi commit của lượt build.
        RELEASE_NOTES=$(python3 Scripts/ci/telegram_commit_summary.py --list build/commit_subjects.txt --format notes)
        [ -n "$RELEASE_NOTES" ] || RELEASE_NOTES=$(git log -1 --pretty=format:"%s")
        python3 Scripts/ci/publish_altstore_source.py \
          --ipa build/FreeBook.ipa \
          --version "$APP_VERSION" \
          --build "$BUILD_NUMBER" \
          --notes "$RELEASE_NOTES" \
          --icon Sources/Assets.xcassets/AppIcon.appiconset/icon_60_3x.png \
          --keep 5
        echo "SOURCE_URL=https://raw.githubusercontent.com/${REPO}/source/apps.json" >> "$GITHUB_ENV"

    - name: Send IPA to Telegram
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TO_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_TO_CHAT_ID }}
      run: |
        IPA_PATH="build/FreeBook.ipa"
        if [ ! -f "$IPA_PATH" ]; then
          echo "Error: IPA file not found at $IPA_PATH"
          exit 1
        fi
        
        FILE_SIZE=$(wc -c < "$IPA_PATH")
        MAX_SIZE=50000000 # ~47.6 MB để đảm bảo an toàn cho giới hạn 50MB của Telegram Bot
        
        # Gửi có kiểm `"ok":true`, lỗi thì thử lại 2 lần (`tg_call`).
        source Scripts/ci/telegram_send.sh

        # Danh sách subject mọi commit của lượt build (bước "Collect Commit List"); thiếu thì commit cuối.
        LIST=build/commit_subjects.txt
        [ -s "$LIST" ] || { git log -1 --pretty=format:"%s" > "$LIST"; echo >> "$LIST"; }
        # Caption của sendDocument bị Telegram giới hạn 1024 ký tự (quá thì trả 400 "message caption is too long",
        # IPA không tới mà curl vẫn exit 0) ⇒ `telegram_commit_summary.py` cắt vừa giới hạn, thừa thì "… và K commit
        # khác". sendMessage giới hạn 4096. Dòng cuối = link nguồn LiveContainer (khi bước Publish chạy được).

        echo "IPA File Size: $FILE_SIZE bytes"

        if [ "$FILE_SIZE" -lt "$MAX_SIZE" ]; then
          echo "File size is under 50MB. Uploading directly to Telegram..."

          HEADER=$(printf "📦 Tàng Công Các %s (%s) Build Thành Công! 🚀" "$APP_VERSION" "$BUILD_NUMBER")
          FOOTER=""
          if [ -n "${SOURCE_URL:-}" ]; then
            FOOTER="📲 Nguồn LiveContainer: $SOURCE_URL"
          fi
          CAPTION=$(python3 Scripts/ci/telegram_commit_summary.py --list "$LIST" --header "$HEADER" --footer "$FOOTER" --limit 1024)

          # `--form-string`: caption gửi nguyên văn (không hiểu `@`/`<`/`;type=` trong subject commit là cú pháp curl).
          tg_call sendDocument \
               --form-string chat_id="${TELEGRAM_CHAT_ID}" \
               -F document=@"$IPA_PATH" \
               --form-string caption="$CAPTION" \
            || echo "IPA không tới được Telegram — vẫn tải được ở GitHub Artifacts / nguồn LiveContainer."
        else
          echo "File size is over 50MB ($FILE_SIZE bytes). Uploading to transfer.sh..."
          # Tải lên transfer.sh làm link dự phòng
          UPLOAD_URL=$(curl --connect-timeout 30 --max-time 300 --upload-file "$IPA_PATH" "https://transfer.sh/FreeBook.ipa" || echo "")
          echo "Uploaded to: $UPLOAD_URL"
          
          HEADER=$(printf "📦 Tàng Công Các %s (%s) Build Thành Công! (File vượt quá 50MB)" "$APP_VERSION" "$BUILD_NUMBER")
          FOOTER=$(printf "\nTải IPA tại đây: %s" "$UPLOAD_URL")
          if [ -n "${SOURCE_URL:-}" ]; then
            FOOTER=$(printf "%s\n📲 Nguồn LiveContainer: %s" "$FOOTER" "$SOURCE_URL")
          fi
          TEXT=$(python3 Scripts/ci/telegram_commit_summary.py --list "$LIST" --header "$HEADER" --footer "$FOOTER" --limit 4096)

          tg_call sendMessage -X POST \
               --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
               --data-urlencode "text=$TEXT" \
            || echo "Tin báo build không tới được Telegram."
        fi

    - name: Send Failure Notification to Telegram
      if: failure()
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TO_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_TO_CHAT_ID }}
      run: |
        # Mọi commit của lượt build (bước "Collect Commit List"); thiếu thì commit cuối. Bỏ chi tiết lỗi cụ thể.
        LIST=build/commit_subjects.txt
        mkdir -p build
        [ -s "$LIST" ] || { git log -1 --pretty=format:"%s" > "$LIST"; echo >> "$LIST"; }
        HEADER=$(printf "❌ Tàng Công Các %s (%s) Build Thất Bại! 🛑" "${APP_VERSION:-?}" "${BUILD_NUMBER:-?}")
        FOOTER=$(printf "\n🔗 Xem toàn bộ log tại: https://github.com/%s/actions/runs/%s" "${{ github.repository }}" "${{ github.run_id }}")
        TEXT=$(python3 Scripts/ci/telegram_commit_summary.py --list "$LIST" --header "$HEADER" --footer "$FOOTER" --limit 4096)

        source Scripts/ci/telegram_send.sh
        tg_call sendMessage -X POST \
             --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
             --data-urlencode "text=$TEXT" \
          || echo "Tin báo build thất bại không tới được Telegram."
