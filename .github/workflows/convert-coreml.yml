name: CoreML Convert Experiment

# Hai job độc lập, cố ý không đụng nhau:
#
#   `convert`  — lượt BASELINE (đã chạy): shape **đóng băng**, trả lời "convert được graph nào" và
#                "Core ML có nhanh hơn ORT CPU không". Giữ nguyên làm mốc so sánh.
#   `dynamic`  — **Phase 0**: thử `.mlpackage` **shape động**. Đây là cổng của plan
#                `Docs/Plans/2026-10-02-plan-vieneu-coreml-engine-trong-app.md`: đạt thì mới làm engine
#                Core ML trong app. Vì sao cần shape động: trọng số chiếm gần hết gói (78,1 MB ở
#                `T=96` **và** 78,5 MB ở `T=234`) ⇒ bucket hoá tốn 127,8 MB cho MỖI mức.
#
# Không job nào đụng `Sources/`, không đụng `build-ipa.yml`. Chạy khi push chính các file này, hoặc bấm tay.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/convert-coreml.yml'
      - 'Scripts/coreml_convert_experiment.py'
      - 'Scripts/coreml_dynamic_experiment.py'
      - 'Scripts/coreml_shape_surgery.py'
      - 'Scripts/coreml_bucket_package.py'

jobs:
  convert:
    name: Convert ONNX to mlpackage (baseline, static shapes)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # `onnx2coreml` yêu cầu Python >=3.11,<3.14. `coremltools` chỉ có wheel cho macOS/Linux.
    - name: Install converters
      run: |
        python -m pip install --upgrade pip
        pip install coremltools onnx2coreml onnxruntime huggingface_hub numpy onnx
        python -c "import coremltools, onnx2coreml, onnxruntime; print('coremltools', coremltools.__version__, '| onnxruntime', onnxruntime.__version__)"

    - name: Run conversion experiment
      run: |
        # `pipefail`: không có nó thì mã thoát của `python` bị `tee` che ⇒ bước này "xanh" dù script lỗi.
        set -o pipefail
        python Scripts/coreml_convert_experiment.py --out reports --workdir coreml-experiment 2>&1 | tee coreml-experiment.log

    # `always()` để vẫn lấy được báo cáo khi một giai đoạn lỗi — "lỗi ở đâu, vì sao" cũng là kết quả.
    - name: Upload reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coreml-experiment-reports
        path: |
          reports/**
          coreml-experiment.log
        if-no-files-found: warn
        retention-days: 14

    - name: Upload mlpackage artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coreml-mlpackages
        path: coreml-experiment/*.mlpackage
        if-no-files-found: warn
        retention-days: 14

    - name: Summary
      if: always()
      run: |
        echo "=== summary.json ==="
        cat reports/summary.json 2>/dev/null || echo "(không có summary.json)"

  bucket:
    name: Phase 2 - bucket packages (publish to HF)
    runs-on: macos-15
    timeout-minutes: 120
    # Bắt buộc để xin OIDC ID token cho Trusted Publishers. **Không có secret nào** — phía HF đã cấu hình
    # claim `repository equals buudvh/FreeBook`.
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install converters (with hf CLI)
      run: |
        python -m pip install --upgrade pip
        pip install coremltools onnx2coreml onnxruntime "huggingface_hub[cli]>=1.19.0" numpy onnx
        python -c "import coremltools, onnx2coreml; print('coremltools', coremltools.__version__)"

    - name: Build bucket packages and goldens
      run: |
        set -o pipefail
        python Scripts/coreml_bucket_package.py --out coreml-bucket --workdir coreml-bucket-work 2>&1 | tee coreml-bucket.log

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coreml-bucket-reports
        path: |
          coreml-bucket/manifest.json
          coreml-bucket/summary.json
          coreml-bucket/golden/**
          coreml-bucket.log
        if-no-files-found: warn
        retention-days: 30

    - name: Publish to HuggingFace (Trusted Publisher OIDC)
      if: always()
      env:
        HF_OIDC_RESOURCE: raikiri1498/VieNeu-TTS-v3-Nano-CoreML
      run: |
        # Chỉ publish khi sinh đủ 7 gói. Thiếu một gói thì phát hành ra một bộ không dùng được còn tệ hơn
        # không phát hành: app sẽ tải về rồi mới phát hiện thiếu.
        verdict=$(python -c "import json; print(json.load(open('coreml-bucket/summary.json')).get('verdict'))")
        echo "verdict: $verdict"
        if [ "$verdict" != "PASS" ]; then
          echo "KHÔNG publish vì chưa sinh đủ gói."
          exit 0
        fi
        ls -R coreml-bucket | head -40
        hf upload raikiri1498/VieNeu-TTS-v3-Nano-CoreML ./coreml-bucket . \
          --commit-message "CoreML buckets T64/T96/T234 (L=200) from ${GITHUB_SHA::7}"
        echo "ĐÃ publish."

    - name: Summary
      if: always()
      run: |
        echo "=== summary.json ==="
        cat coreml-bucket/summary.json 2>/dev/null || echo "(không có summary.json)"

  dynamic:
    name: Phase 0 - dynamic shape probe
    runs-on: macos-15
    timeout-minutes: 120

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # `torch` + `onnx2torch`: đường shape động bắt buộc đi qua frontend torch của `coremltools` vì
    # `onnx2coreml` ghi thẳng trong *Known limitations* là **"Fixed input shapes"**. `torch` nặng
    # ~200 MB nên bước này chậm hơn job baseline vài phút — đổi lại nó là thứ quyết định cả plan.
    - name: Install converters (with torch)
      run: |
        python -m pip install --upgrade pip
        pip install coremltools onnx2coreml onnxruntime huggingface_hub numpy onnx torch onnx2torch
        python -c "import coremltools, onnx, torch, onnx2torch, onnx2coreml; print('coremltools', coremltools.__version__, '| torch', torch.__version__)"

    - name: Probe dynamic shapes
      run: |
        set -o pipefail
        python Scripts/coreml_dynamic_experiment.py --out reports-dynamic --workdir coreml-dynamic 2>&1 | tee coreml-dynamic.log

    # Chỉ upload **báo cáo** (JSON + `golden.npz`), cố ý **không** upload `.mlpackage`: 4 graph × 4 đường
    # là tới ~1,2 GB, mà Phase 1 sẽ chạy lại conversion (mỗi graph ~7 s) nên gói cũ là rác.
    - name: Upload reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coreml-dynamic-reports
        path: |
          reports-dynamic/**
          coreml-dynamic.log
        if-no-files-found: warn
        retention-days: 30

    - name: Verdict
      if: always()
      run: |
        echo "=== range_report.json ==="
        cat reports-dynamic/range_report.json 2>/dev/null || echo "(không có range_report.json)"
        echo
        echo "=== verdict ==="
        python - <<'PY'
        import json, os
        path = "reports-dynamic/summary.json"
        if not os.path.exists(path):
            print("(không có summary.json)")
            raise SystemExit(0)
        data = json.load(open(path, encoding="utf-8"))
        print("verdict:", data.get("verdict"))
        print("(chi tinh duong SHAPE DONG:", ", ".join(data.get("dynamic_routes") or []), ")")
        for graph, entry in (data.get("routes") or {}).items():
            ok = [route for route, info in entry.items() if info.get("ok")]
            print(f"  {graph}: {'OK ' + ','.join(ok) if ok else 'KHONG duong nao chay duoc'}")
        print("  trace chay lai duoc / 3 shape:")
        for graph, routes in (data.get("trace_ok") or {}).items():
            print(f"    {graph}: {routes}")
        golden = data.get("golden") or {}
        print("  golden:", golden.get("snr_db") if golden.get("ok") else golden.get("reason"))
        bucket = data.get("bucket_fallback") or {}
        if bucket:
            print(f"  bucket du phong: {bucket.get('total_bytes', 0) / 1e6:.1f} MB")
        sweep = (data.get("ort_l_sweep") or {}).get("ort_ms") or {}
        for graph, rows in sweep.items():
            for frames, row in rows.items():
                print(f"  {graph} {frames}: " + " ".join(f"L{k}={v}" for k, v in row.items()))
        PY
