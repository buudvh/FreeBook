name: Codex Integrate NGHI Audio Queue

on:
  push:
    branches:
      - sigle_reader
    paths:
      - .github/workflows/codex-integrate-nghi-audio-queue.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sigle_reader
      - name: Apply guarded patch
        run: python3 -c "import base64,zlib;exec(zlib.decompress(base64.b64decode('')) )"
      - name: Validate patch
        run: |
          git diff --check
          grep -q 'private let nghiAudioPlayerQueue = NghiAudioPlayerQueue()' Sources/Services/TTS/TTSManager.swift
          grep -q 'try nghiAudioPlayerQueue.start' Sources/Services/TTS/TTSManager.swift
          grep -q 'func clearPreparedNext()' Sources/Services/TTS/NghiTTS/NghiAudioPlayerQueue.swift
      - name: Commit integration
        run: |
          rm .github/workflows/codex-integrate-nghi-audio-queue.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sources/Services/TTS/TTSManager.swift Sources/Services/TTS/NghiTTS/NghiAudioPlayerQueue.swift .github/workflows/codex-integrate-nghi-audio-queue.yml
          git commit -m 'Integrate NGHI AVAudioPlayer handoff queue'
          git push origin HEAD:sigle_reader
