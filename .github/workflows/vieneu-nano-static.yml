# Xuất gói graph tĩnh VieNeu-TTS v3 Nano cho phép thử P1 (So EP cho Nano: Core ML / ANE / XNNPACK) rồi đăng vào thư
# mục `nano-static/` của kho Hugging Face `raikiri1498/VieNeu-TTS` (cùng kho với model, `VieNeuModelMirror`).
# **Chỉ chạy tay** (workflow_dispatch, từ nhánh `main`).
#
# Đăng bằng **Trusted Publisher** (OIDC) — không có secret nào. Một lần, trên
# https://huggingface.co/raikiri1498/VieNeu-TTS/settings › Trusted Publishers, thêm:
#   Provider = GitHub Actions; claims: repository = buudvh/FreeBook, branch = main, workflow = vieneu-nano-static.yml
# (tài liệu: https://huggingface.co/docs/hub/trusted-publishers). Chưa cấu hình thì bước đăng báo lỗi xác thực.
#
# - Script `Scripts/vieneu_nano_static_export.py` tải model `pnnbao-ump/VieNeu-TTS-v3-Nano` rev `aba295eb`, mổ graph,
#   dựng golden 5 đoạn và **tự kiểm** (nạp lại từ đĩa, so graph gốc). Tự kiểm rớt ⇒ thoát mã 1 ⇒ không đăng gì.
# - Phiên bản thư viện ghim đúng như lúc kiểm trên PC để file ra giống nhau. App đọc
#   `https://huggingface.co/raikiri1498/VieNeu-TTS/resolve/main/nano-static/<file>` và kiểm sha256 theo manifest.
name: VieNeu Nano static graphs (P1)

on:
  workflow_dispatch:

concurrency:
  group: vieneu-nano-static
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write   # xin OIDC token để đổi lấy token HF ngắn hạn (Trusted Publisher)
      contents: read
    env:
      OUT: build/vieneu-nano-static
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "onnx==1.23.2" "onnxruntime==1.24.2" "numpy==2.5.4" "huggingface_hub[cli]==2.4.0"
        python -c "import huggingface_hub; print('huggingface_hub', huggingface_hub.__version__)"
        command -v hf

    - name: Export + self-test
      run: |
        set -o pipefail
        mkdir -p build
        python Scripts/vieneu_nano_static_export.py --out "$OUT" --model-dir build/vieneu-nano-source 2>&1 | tee build/export.log
        test -f "$OUT/manifest.json"
        ls -la "$OUT"

    - name: Publish to Hugging Face (Trusted Publisher OIDC)
      env:
        HF_OIDC_RESOURCE: raikiri1498/VieNeu-TTS
      run: |
        hf upload raikiri1498/VieNeu-TTS "$OUT" nano-static \
          --commit-message "nano-static: graph tĩnh cho phép thử So EP (P1) từ ${GITHUB_SHA::7}"
