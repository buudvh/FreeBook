name: FreeBook
options:
  bundleIdPrefix: com.raikiri1498
  deploymentTarget:
    iOS: "17.0"
  projectFormat: Xcode_15.0
packages:
  SwiftSoup:
    type: git
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.7.0
  ZIPFoundation:
    type: git
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.0
  # ONNX Runtime (NghiTTS, VieNeu) — gói **cục bộ** trong repo (1.3.979). Repo gốc `microsoft/onnxruntime-swift-package-manager`
  # (và `microsoft/onnxruntime`) trả 404 từ 2026-11-17 ⇒ chép mã nguồn bản 1.24.2 vào `Vendor/`, file nhị phân 52 MB lưu ở
  # release `onnxruntime-1.24.2` của repo `buudvh/FreeBook-deps` (checksum trùng bản gốc của Microsoft). Xem đầu
  # `Vendor/onnxruntime-swift-package-manager/Package.swift`. Tên package / product giữ nguyên.
  onnxruntime-swift-package-manager:
    path: Vendor/onnxruntime-swift-package-manager
  # vtts (Việt–Anh, runtime C99) — gói cục bộ: runtime chép nguyên văn ở commit ghim (`Vendor/vtts/VTTS_COMMIT.txt`) +
  # shim `vtts_bridge` (product `CVTTS`, Swift `import CVTTS`). Model + từ điển là resource riêng (xem `sources` bên dưới);
  # mọi thứ (kể cả công cụ dựng lại từ điển) nằm trong `Vendor/vtts`, không phụ thuộc repo upstream — `Vendor/vtts/README.md`.
  vtts:
    path: Vendor/vtts
  espeak-ng-spm:
    type: git
    url: https://github.com/espeak-ng/espeak-ng-spm.git
    revision: cb0dfa23248513e39b9619d8d1383da329507281
  # Chuyển bộ lọc AdGuard sang JSON luật WebKit (chặn quảng cáo cho webview). Có build-tool plugin
  # `GenerateVersion` ⇒ CI phải chạy xcodebuild với `-skipPackagePluginValidation`.
  SafariConverterLib:
    type: git
    url: https://github.com/AdguardTeam/SafariConverterLib.git
    exactVersion: 4.3.1
targets:
  FreeBook:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Resources/ExtensionLibraries"
      # Thư viện JS tiện ích nạp bằng `load('<tên>')` (`JSBuiltInLibrary`) — khai tường minh là resource để `.js`
      # chắc chắn vào Copy Bundle Resources, không rơi vào Compile Sources.
      - path: Sources/Resources/ExtensionLibraries
        buildPhase: resources
      # Tài sản vtts đóng vào app (4 giọng bản M — 2 của release + Ngọc Huyền, Google Dịch tự train — + từ điển VLEX,
      # ~12 MB) — lưu sẵn trong repo ở `Vendor/vtts/assets/vtts`
      # (bản S dự trữ + CMUdict nằm ngoài thư mục này, không vào bundle). Folder reference ⇒ bundle có thư mục con `vtts/`
      # (`VttsRuntime` tra ở đó). CI kiểm SHA256 + đọc thử bằng `Scripts/ci/check_vtts_assets.sh`.
      - path: Vendor/vtts/assets/vtts
        type: folder
        buildPhase: resources
    dependencies:
      - package: SwiftSoup
      - package: ZIPFoundation
      - package: onnxruntime-swift-package-manager
        product: onnxruntime
      - package: vtts
        product: CVTTS
      - package: espeak-ng-spm
        product: libespeak-ng
      - package: espeak-ng-spm
        product: espeak-ng-data
      - package: SafariConverterLib
        product: ContentBlockerConverter
      - sdk: libsqlite3.tbd
      # XPath của nguồn Legado (`LegadoXPathDocument`). Header nằm ở HEADER_SEARCH_PATHS bên dưới.
      - sdk: libxml2.tbd
      # audio.cpp (ggml) cho VieNeu Turbo GGUF — dynamic framework, Swift `import AudioCpp`. Không commit: CI dựng bằng
      # `Scripts/ci/build_audiocpp_ios.sh` trước bước `xcodegen generate` (máy Mac chạy script đó trước khi generate).
      - framework: Vendor/AudioCpp/AudioCpp.xcframework
        embed: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "Tàng Công Các"
        # Version do CI chèn lúc build (`build-ipa.yml`): số bản đầu `Docs/CodeGraph/CHANGELOG.md` + số lượt chạy CI.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        # Liên kết nhập nhanh nguồn Legado `legado://import/importonline?src=…` (spec §12.2) — app luôn hỏi lại trước khi nhập.
        CFBundleURLTypes:
          - CFBundleURLName: com.raikiri1498.FreeBook.legado
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - legado
        NSLocalNetworkUsageDescription: "Tàng Công Các mở một server debug trên mạng nội bộ để máy phát triển kết nối và chạy thử extension. Mặc định tắt, chỉ bật bằng tay trong Cài Đặt."
        NSMicrophoneUsageDescription: "Tàng Công Các dùng micro để thu 3–8 giây giọng nói làm mẫu, từ đó tạo giọng đọc riêng cho phần đọc truyện. Bản thu chỉ nằm trên máy bạn."
        NSPhotoLibraryAddUsageDescription: "Tàng Công Các cần quyền thêm ảnh để lưu ảnh khi bạn nhấn giữ ảnh trong trình duyệt và chọn Lưu ảnh. App không đọc thư viện ảnh của bạn."
        GOOGLE_CLOUD_TTS_API_KEY: "$(GOOGLE_CLOUD_TTS_API_KEY)"
        GOOGLE_DRIVE_CLIENT_ID: "$(GOOGLE_DRIVE_CLIENT_ID)"
    settings:
      base:
        # Bridging header gom mọi header C mà Swift cần (`FreeBookBridgingHeader.h`):
        # - cầu nối C API của ONNX Runtime cho engine VieNeu-TTS (`VieNeuONNXBridge.h/.m`). Cần thiết vì module C
        #   của ORT không import được từ Swift (product SPM `onnxruntime` chỉ trỏ tới target ObjC), mà lớp ObjC lại
        #   không tạo được tensor `bool` — xem doc trong `VieNeuONNXRuntime.swift`;
        # - libxml2 hệ thống cho XPath của nguồn Legado (`LegadoLibXML2.h`).
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Common/Bridging/FreeBookBridgingHeader.h
        # Header của libxml2 tự include nhau theo dạng `<libxml/...>` nên phải trỏ vào thư mục `libxml2`.
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SDKROOT)/usr/include/libxml2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.raikiri1498.FreeBook
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Giá trị mặc định cho bản build tay. CI ghi đè bằng `MARKETING_VERSION=<1.3.NNN của CHANGELOG>`
        # `CURRENT_PROJECT_VERSION=<github.run_number>` trên dòng lệnh `xcodebuild archive`.
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "1"
      # Rút ngắn bước archive của CI (đo 2026-11-13, runner macos-15 3 lõi / 7 GB; chi tiết CHANGELOG 1.3.916):
      # - `singlefile`: biên dịch từng file song song 3 luồng thay vì cả module trong một tiến trình (WMO). WMO tốn
      #   ~1000–1300 s, một nửa là tối ưu SIL chạy gần như một luồng, và đẩy RAM tới ~5 GB (swap). Đánh đổi: mất tối ưu
      #   xuyên file (inline / specialize / suy `final`) ⇒ code Swift tính nặng có thể chậm hơn chút; ORT / Core ML /
      #   audio.cpp không bị ảnh hưởng.
      # - Không sinh debug info / dSYM (188 MB mỗi lượt, không ai dùng: archive không tải lên, binary đã strip).
      # Chỉ target FreeBook; gói SPM giữ mặc định.
      configs:
        Release:
          SWIFT_COMPILATION_MODE: singlefile
          DEBUG_INFORMATION_FORMAT: dwarf
          GCC_GENERATE_DEBUGGING_SYMBOLS: "NO"
